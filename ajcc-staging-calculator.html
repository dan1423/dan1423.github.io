<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AJCC Staging Calculator</title>
<meta name="description" content="AJCC TNM staging calculator: clinical, pathological, post-therapy and de novo metastatic staging.">
<meta name="theme-color" content="#003087">
<link rel="icon" type="image/png" sizes="32x32" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAB+klEQVR4nO2Vv2sUQRTHv9/Z2dvs7cXNYVDCiaB/gAQsBAv/AVvttVERCxt7wcJ/wUYsbAUtxMJKJBBsRGN1QsRCEYMWEs94uzPvWYhy8eZ29y5cFV858977zPs5xOptzFPMXL3/B+wPgK3VIGkYvlJARPcGILRwvvATrA0WLCoRVQAS6qTXy48f6aqqIaPIABARL0py6+ug/+4LrdHJjCpAZIzb3rl45cStq2eCCk/WNs9euG+W2t7LLAARRRo/XX9vDP3Q9VbyS+dWCT569vbl6482bb3qf0YSV5eBNbuIxM8SQ4dBcezk0c3Hl0mev/Hwwb11dDMYIktQkaD6IquaNLaLiaTx8lL6+yzvJHa5Y/N26bzfaxcBIuqciBP3J9Fe1DmBl1rv2B+T/FdU4ZyQlMqqzgpQxNbEcQQgTWx150wNUAVa0Yet7Zt31ki8ePMJC3HDOOrmYEQRTvB9CAXaLTQOYooU0ZroYAZAvDYvQxgQXs8K76RCIcgMA3QCok4CiACAQKbFVAQFCPyg9WMv2wUgoGCmxd1vz3Mtx7UnA9hWd33x1EbrsNFSRgwDERhgRXa6OnRgQ4KAHXUJAr/CLoACgA5orx04bVWmqkQE7dsc6v+xCkTgwY34UHPXIw/0GJuOcBcZLWfxD463URggM7ZpQOa+rn8BtY/Qx+ls8NoAAAAASUVORK5CYII=">
<style>
  :root {
    --blue: #003087; --blue-dark: #00225f; --blue-light: #e8edf5; --blue-hover: #f3f6fb;
    --red: #c41e3a;
    --white: #ffffff; --bg: #f2f3f5; --panel-alt: #fafafa;
    --border: #cccccc; --border-light: #e2e4e8;
    --text: #1a1a1a; --text-mid: #555555; --text-light: #888888;
    --mono: "Courier New", Courier, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
    --tabbar-h: 58px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
  button { font-family: var(--sans); color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  svg { display: block; }

  /* ════ Shell (desktop / wide browser): centered card, two panes ════ */
  .app { max-width: 1080px; margin: 20px auto; background: var(--white); border: 1px solid var(--border); display: flex; flex-direction: column; }

  .appbar { background: var(--blue); color: var(--white); display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; position: relative; }
  .appbar .back { display: none; align-items: center; gap: 2px; background: none; border: 0; color: var(--white); font-size: 16px; padding: 10px 8px 10px 0; cursor: pointer; }
  .appbar .back svg { width: 22px; height: 22px; }
  .appbar .title { flex: 1; min-width: 0; }
  .appbar h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar .subtitle { font-size: 12px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar .badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border: 1px solid rgba(255,255,255,.6); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }

  .subbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border-light); background: var(--white); }
  .subbar label { font-size: 11px; font-weight: 700; color: var(--text-mid); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  select { flex: 1; max-width: 320px; padding: 7px 8px; font-size: 14px; font-family: var(--sans); border: 1px solid var(--border); border-radius: 0; background: var(--white); color: var(--text); cursor: pointer; }

  /* Test cases (mock only) */
  .tests { padding: 8px 16px; border-bottom: 1px solid var(--border-light); background: var(--panel-alt); display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  .tests::-webkit-scrollbar { display: none; }
  .tests > span { font-size: 10px; font-weight: 700; color: var(--text-mid); text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; white-space: nowrap; }
  .btn { font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); background: var(--white); color: var(--text); cursor: pointer; border-radius: 0; white-space: nowrap; }
  .btn:active { background: var(--blue-light); }
  .btn.sel { background: var(--blue); border-color: var(--blue); color: var(--white); font-weight: 700; }
  .btn.ghost { color: var(--text-mid); }

  .content { display: grid; grid-template-columns: 1fr 1fr; min-height: 460px; flex: 1; }
  .main { padding: 20px; border-right: 1px solid var(--border-light); min-width: 0; }
  .detail { padding: 20px; background: var(--panel-alt); min-width: 0; overflow: hidden; }

  /* ════ Category rows ════ */
  .sec + .sec { margin-top: 22px; }
  .sec-title { font-size: 11px; font-weight: 700; color: var(--text-mid); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
  .list { border: 1px solid var(--border-light); background: var(--white); }
  .rowbtn { width: 100%; border: 0; border-bottom: 1px solid var(--border-light); background: var(--white); padding: 0 12px 0 0; min-height: 52px; text-align: left; display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: 0; position: relative; }
  .list .rowbtn:last-child { border-bottom: 0; }
  .rowbtn::before { content: ""; align-self: stretch; width: 4px; background: transparent; flex: 0 0 4px; }
  .rowbtn:active { background: var(--blue-light); }
  .rowbtn.filled::before { background: var(--blue); }                     /* a value has been chosen */
  .rowbtn.on { background: var(--blue-light); }                            /* open in the definitions pane */
  .rowbtn.on::before { background: var(--blue); }
  .rowbtn .code { font-family: var(--mono); font-weight: 700; font-size: 18px; color: var(--blue); min-width: 46px; }
  .rowbtn .name { flex: 1; color: var(--text-mid); font-size: 13px; }
  .rowbtn .val { font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--text); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .rowbtn .val.empty { font-family: var(--sans); font-weight: 400; font-size: 13px; color: var(--text-light); }
  .rowbtn .tick { width: 16px; height: 16px; background: var(--blue); color: var(--white); display: inline-flex; align-items: center; justify-content: center; }
  .rowbtn .tick svg { width: 11px; height: 11px; }
  .rowbtn .chev { color: var(--text-light); width: 16px; height: 16px; flex: 0 0 16px; }
  .rowbtn.small { min-height: 44px; }
  .rowbtn.small .code { font-family: var(--sans); font-size: 13px; color: var(--text); min-width: 52px; }
  .rowbtn.small .val { font-family: var(--sans); font-size: 13px; }

  .factors { margin-top: 10px; }
  .factors-title { width: 100%; display: flex; align-items: center; gap: 6px; background: none; border: 0; border-radius: 0; cursor: pointer; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-mid); text-transform: uppercase; letter-spacing: .06em; padding: 8px 0; }
  .factors-title .caret { font-size: 9px; transition: transform .15s; }
  .factors.collapsed .factors-title .caret { transform: rotate(-90deg); }
  .factors-title .count { margin-left: auto; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-light); }
  .factors.collapsed .list { display: none; }

  /* ════ Results ════ */
  .result { margin-top: 22px; }
  .tnmbox { background: var(--blue); color: var(--white); padding: 12px 14px; }
  .cap { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 3px; }
  .tnmbox .cap { opacity: .75; }
  .tnmbox .v { font-family: var(--mono); font-size: 17px; font-weight: 700; word-break: break-word; }
  .stagebox { border: 2px solid var(--blue); border-top: 0; padding: 12px 14px; background: var(--white); }
  .stagebox .cap { color: var(--text-mid); }
  .stagebox .v { font-size: 24px; font-weight: 700; color: var(--blue); }
  .stagebox p { margin: 6px 0 0; font-size: 13px; color: var(--text-mid); line-height: 1.5; }
  .pending { border: 1px dashed var(--border); padding: 12px 14px; color: var(--text-light); font-size: 13px; line-height: 1.5; background: var(--white); }
  .pending strong { display: block; color: var(--text-mid); font-size: 14px; margin-bottom: 2px; }
  .cmp { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; background: var(--white); }
  .cmp th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-mid); padding: 6px 8px; border-bottom: 2px solid var(--blue); }
  .cmp td { padding: 7px 8px; border-bottom: 1px solid var(--border-light); font-family: var(--mono); font-weight: 700; color: var(--blue); }
  .cmp td:first-child { font-family: var(--sans); font-weight: 600; color: var(--text-mid); }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .respbox { border: 2px solid var(--blue); padding: 12px 14px; background: var(--white); }
  .respbox .cap { color: var(--text-mid); }
  .respbox .v { font-size: 16px; font-weight: 700; color: var(--blue); }
  .v.err { color: var(--red) !important; }
  .duo .tnmbox .v { font-family: var(--sans); font-size: 18px; }
  .duo .tnmbox .m { font-family: var(--mono); font-size: 12px; opacity: .8; margin-top: 4px; }
  .ver { margin-top: 8px; font-size: 11px; color: var(--text-light); }

  /* ════ Definitions ════ */
  .detail h2 { font-size: 16px; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--blue); }
  .detail h2 .code { font-family: var(--mono); color: var(--blue); }
  .detail .dback { background: none; border: 0; color: var(--blue); font-weight: 700; cursor: pointer; padding: 0 0 14px; font-size: 13px; }
  .detail .muted { font-size: 13px; color: var(--text-mid); line-height: 1.5; margin: 0; }
  .choice { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--border-light); background: var(--white); margin-bottom: -1px; cursor: pointer; border-radius: 0; position: relative; }
  .choice:active { background: var(--blue-light); }
  .choice.sel { background: var(--blue); border-color: var(--blue); z-index: 2; }       /* the chosen value */
  .choice b { font-family: var(--mono); font-size: 15px; color: var(--blue); min-width: 72px; }
  .choice .d { font-size: 13px; color: var(--text-mid); line-height: 1.4; flex: 1; }
  .choice.sel b, .choice.sel .d { color: var(--white); }
  .choice .ck { width: 18px; height: 18px; flex: 0 0 18px; border: 1.5px solid var(--border); display: inline-flex; align-items: center; justify-content: center; }
  .choice.sel .ck { border-color: var(--white); background: var(--white); color: var(--blue); }
  .choice .ck svg { width: 12px; height: 12px; }
  .clear { margin-top: 12px; background: none; border: 0; padding: 4px 0; color: var(--text-mid); font-size: 13px; cursor: pointer; text-decoration: underline; }
  .note { margin-top: 12px; font-size: 12px; color: var(--text-mid); line-height: 1.5; border-left: 2px solid var(--border); padding-left: 8px; }

  /* ════ Tab bar ════ */
  .tabbar { display: flex; border-top: 1px solid var(--border); background: var(--white); }
  .tab { flex: 1; border: 0; background: var(--white); color: var(--text-mid); padding: 8px 4px; min-height: var(--tabbar-h); cursor: pointer; font-size: 12px; font-weight: 600; border-radius: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; }
  .tab svg { width: 22px; height: 22px; }
  .tab:active { background: var(--blue-hover); }
  .tab.active { background: var(--blue); color: var(--white); }               /* current staging type */
  .tab .dot { position: absolute; top: 7px; right: calc(50% - 18px); width: 7px; height: 7px; background: var(--blue); border: 1.5px solid var(--white); }
  .tab.active .dot { background: var(--white); border-color: var(--blue); }

  /* Hover only on devices with a real pointer, so highlights don't stick after a tap on phones */
  @media (hover: hover) {
    .btn:hover { border-color: var(--blue); }
    .rowbtn:hover { background: var(--blue-hover); }
    .choice:hover { border-color: var(--blue); z-index: 1; }
  }

  .screen { animation: in-right .22s ease-out; }
  .screen.from-left { animation-name: in-left; }
  @keyframes in-right { from { transform: translateX(24px); opacity: .3; } to { transform: none; opacity: 1; } }
  @keyframes in-left { from { transform: translateX(-24px); opacity: .3; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none !important; } }

  /* ════ Phone: full-width app-style layout ════ */
  @media (max-width: 680px) {
    html, body { overscroll-behavior-y: none; }
    body { -webkit-user-select: none; user-select: none; }
    .app { margin: 0; border: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); }
    .appbar { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top); padding-left: calc(12px + env(safe-area-inset-left)); padding-right: calc(12px + env(safe-area-inset-right)); min-height: calc(54px + env(safe-area-inset-top)); }
    .app.field-open .appbar .back { display: inline-flex; }
    .app.field-open .appbar .badge { display: none; }
    .app.field-open .subbar, .app.field-open #tests { display: none; }
    select { max-width: none; font-size: 16px; padding: 9px 10px; }   /* 16px stops iOS zoom on focus */
    .content { display: block; min-height: 0; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px); }
    .main { border: 0; padding: 16px; }
    .main.hidden { display: none; }
    .detail { display: none; background: var(--bg); }
    .detail.open { display: block; padding: 16px; }
    .detail h2, .detail .dback { display: none; }   /* the app bar carries the title and back button */
    .main .list, .detail .choices { margin: 0 -16px; border-left: 0; border-right: 0; }
    .choice { border-left: 0; border-right: 0; min-height: 54px; padding: 12px 16px; }
    .rowbtn { min-height: 56px; }
    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding-bottom: env(safe-area-inset-bottom); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); box-shadow: 0 -1px 0 var(--border); border-top: 0; }
    .tab { font-size: 11px; }
    .duo { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="appbar">
    <button class="back" data-action="back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back
    </button>
    <div class="title"><h1 id="apptitle">AJCC Staging</h1><div class="subtitle" id="appsub"></div></div>
    <span class="badge" id="mockbadge" hidden>Test data</span>
  </header>
  <div class="subbar">
    <label for="disease">Site</label>
    <select id="disease" data-action="disease"><option value="">Loading…</option></select>
  </div>
  <div id="tests"></div>
  <div class="content">
    <main id="main" class="main"></main>
    <aside id="detail" class="detail" aria-live="polite"></aside>
  </div>
  <nav id="tabs" class="tabbar" aria-label="Staging type"></nav>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
 * CONFIG — set USE_MOCK = false to call the real API at BASE_URL
 * ════════════════════════════════════════════════════════════════════════ */
const USE_MOCK = true;
const BASE_URL = "https://localhost:7166";
const APP_VERSION = "1.1.0";
const RULES_LABEL = "AJCC 8th edition";

/* ════════════════════════════════════════════════════════════════════════
 * MOCK DATA (test values only — simplified AJCC 8th ed. breast anatomic rules)
 * ════════════════════════════════════════════════════════════════════════ */
const MOCK_DISEASES = [{ ajccDiseaseId: "BRE-DCIS", diseaseTitle: "Breast" }];
const opt = (id, list) => list.map(([v, d]) => ({ validValueId: id, validValue: v, descr: d }));

function mockStagingItems(typeId) {
  const p = typeId === 1 ? "Clinical" : "Pathological";
  return [
    { columnName: "T", columnTitle: "T", valueDescList: opt("T", [
      ["TX", "Primary tumor cannot be assessed"], ["T0", "No evidence of primary tumor"], ["Tis", "Carcinoma in situ (DCIS or Paget disease)"],
      ["T1mi", "Tumor ≤ 1 mm"], ["T1a", "Tumor > 1 mm but ≤ 5 mm"], ["T1b", "Tumor > 5 mm but ≤ 10 mm"], ["T1c", "Tumor > 10 mm but ≤ 20 mm"],
      ["T2", "Tumor > 20 mm but ≤ 50 mm"], ["T3", "Tumor > 50 mm"], ["T4a", "Extension to the chest wall"],
      ["T4b", "Ulceration, satellite nodules or skin edema"], ["T4c", "Both T4a and T4b"], ["T4d", "Inflammatory carcinoma"]]) },
    { columnName: "N", columnTitle: "N", valueDescList: opt("N", [
      ["NX", "Regional lymph nodes cannot be assessed"], ["N0", "No regional lymph node metastasis"], ["N1mi", "Micrometastases (> 0.2 mm, ≤ 2 mm)"],
      ["N1", "Metastasis to 1–3 axillary nodes / movable nodes"], ["N2", "Metastasis to 4–9 axillary nodes / fixed or matted nodes"],
      ["N3", "≥ 10 axillary nodes, or infra- / supraclavicular nodes"]]) },
    { columnName: "M", columnTitle: "M", valueDescList: opt("M", [
      ["M0", "No clinical or radiographic evidence of distant metastasis"],
      ["cM0(i+)", "Tumor cells ≤ 0.2 mm in blood, marrow or distant tissue, no symptoms"],
      ["M1", "Distant metastasis present"]]) },
    { columnName: "AJCCfactorG", columnTitle: "Grade", valueDescList: opt("AJCCfactorG", [["G1", "Low combined histologic grade"], ["G2", "Intermediate combined histologic grade"], ["G3", "High combined histologic grade"]]) },
    { columnName: "AJCCfactorER", columnTitle: "ER", valueDescList: opt("AJCCfactorER", [["Positive", `${p} estrogen receptor positive`], ["Negative", `${p} estrogen receptor negative`]]) },
    { columnName: "AJCCfactorPR", columnTitle: "PR", valueDescList: opt("AJCCfactorPR", [["Positive", `${p} progesterone receptor positive`], ["Negative", `${p} progesterone receptor negative`]]) },
    { columnName: "AJCCfactorHER2", columnTitle: "HER2", valueDescList: opt("AJCCfactorHER2", [["Positive", "HER2 positive"], ["Negative", "HER2 negative"]]) },
  ];
}

const stripPrefix = (v) => (v || "").replace(/^(yp|c|p)(?=[TNM])/, "");

/** Simplified anatomic stage group (mock only). */
function anatomicStage(Traw, Nraw, Mraw) {
  const T = stripPrefix(Traw), N = stripPrefix(Nraw), M = stripPrefix(Mraw);
  if (M.startsWith("M1")) return "IV";
  if (!T || !N) return null;
  if (T === "TX" || N === "NX") return "Unknown (TX / NX)";
  if (N === "N3") return "IIIC";
  if (T.startsWith("T4")) return "IIIB";
  if (T === "Tis" && N === "N0") return "0";
  const t = T === "Tis" || T === "T0" ? 0 : T.startsWith("T1") ? 1 : T === "T2" ? 2 : 3;
  const n = N === "N0" ? 0 : N === "N1mi" ? 0.5 : N === "N1" ? 1 : 2;
  if (n === 2) return "IIIA";
  if (t === 3) return n === 0 ? "IIB" : "IIIA";
  if (t === 2) return n === 0 ? "IIA" : "IIB";
  if (n === 1) return "IIA";
  if (n === 0.5) return "IB";
  return t === 1 ? "IA" : "No residual tumor";
}
const fmtStage = (g) => (!g ? "..." : /^[0IV]/.test(g) ? "Stage " + g : g);

function tnmString(prefix, v) {
  const mPrefix = prefix === "yp" ? "c" : prefix; // yp staging carries clinical M
  return [v.T && prefix + stripPrefix(v.T), v.N && prefix + stripPrefix(v.N), v.M && mPrefix + stripPrefix(v.M)].filter(Boolean).join(" ") || "...";
}

const T_RANK = { TX: -1, T0: 0, Tis: 0.5, T1mi: 1, T1a: 1, T1b: 1, T1c: 1, T2: 2, T3: 3, T4a: 4, T4b: 4, T4c: 4, T4d: 4 };
const N_RANK = { NX: -1, N0: 0, N1mi: 0.5, N1: 1, N2: 2, N3: 3 };

/** Mock /breastresponse → 0 = No Response, 1 = Partial, 2 = Complete. */
function mockResponse(c, p) {
  const ypT = stripPrefix(p.T), ypN = stripPrefix(p.N);
  if ((ypT === "T0" || ypT === "Tis") && ypN === "N0") return 2;
  const tSameOrWorse = (T_RANK[ypT] ?? 0) >= (T_RANK[stripPrefix(c.T)] ?? 0);
  const nSameOrWorse = (N_RANK[ypN] ?? 0) >= (N_RANK[stripPrefix(c.N)] ?? 0);
  return tSameOrWorse && nSameOrWorse ? 0 : 1;
}

const delay = (v) => new Promise((r) => setTimeout(() => r(v), 200));
const getJson = (url, init) => fetch(url, init).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });

/* ════════════════════════════════════════════════════════════════════════
 * API LAYER — same endpoints as the React version
 * ════════════════════════════════════════════════════════════════════════ */
const api = {
  diseases: () => USE_MOCK ? delay(MOCK_DISEASES) : getJson(`${BASE_URL}/tnmstaging/diseases`),
  stagingItems: (diseaseId, typeId) => USE_MOCK ? delay(mockStagingItems(typeId))
    : getJson(`${BASE_URL}/tnmstaging/staging-data-items-v2/${diseaseId}/${typeId}`),
  calculate: (diseaseId, typeId, values, prefix) => {
    if (USE_MOCK) return delay({ stage: fmtStage(anatomicStage(values.T, values.N, values.M)), tnmClassification: tnmString(prefix, values) });
    const q = new URLSearchParams({ diseaseId, stagingTypeId: String(typeId), ...values });
    return getJson(`${BASE_URL}/tnmstaging/calculate?${q}`);
  },
  breastResponse: (clinical, pathological) => USE_MOCK ? delay(mockResponse(clinical, pathological))
    : getJson(`${BASE_URL}/tnmstaging/breastresponse`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ clinical, pathological }) }),
  calculateBreast: (b, responseTypeId) => {
    if (USE_MOCK) {
      const tnm = tnmString("yp", b);
      return delay(responseTypeId === 2 ? { stage: "pCR", tnmClassification: tnm } : { stage: fmtStage(anatomicStage(b.T, b.N, b.M)), tnmClassification: tnm });
    }
    const q = new URLSearchParams({ responseTypeId: String(responseTypeId), T: b.T, N: b.N, M: b.M,
      AJCCfactorER: b.AJCCfactorER, AJCCfactorG: b.AJCCfactorG, AJCCfactorHER2: b.AJCCfactorHER2, AJCCfactorPR: b.AJCCfactorPR });
    return getJson(`${BASE_URL}/tnmstaging/calculatebreast?${q}`);
  },
};

/* ════════════════════════════════════════════════════════════════════════
 * STAGING TYPES — each has one or two input sections
 *   prefix: shown on values (c / p / yp); typeId: API stagingTypeId
 * ════════════════════════════════════════════════════════════════════════ */
const ICONS = {
  clinical: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="5" y="4" width="14" height="17"/><path d="M9 2.5h6v3H9zM8.5 11h7M8.5 15h7"/></svg>',
  pathological: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 21h14M8 21v-3h8"/><path d="M15 18a5 5 0 0 0 1.5-9.5"/><path d="M9.5 3.5l3 1.5-3 6-3-1.5z"/><path d="M8 11l-1 2"/></svg>',
  posttherapy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4.5 11a7.5 7.5 0 0 1 13-4.5L19.5 8.5M19.5 13a7.5 7.5 0 0 1-13 4.5L4.5 15.5"/><path d="M19.5 4v4.5H15M4.5 20v-4.5H9"/></svg>',
  denovo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><circle cx="5" cy="5" r="1.6"/><circle cx="19" cy="6" r="1.6"/><circle cx="18.5" cy="18.5" r="1.6"/><circle cx="5" cy="18" r="1.6"/><path d="M9.7 9.7L6.2 6.2M14.5 10l3.2-2.7M14.4 14.4l2.9 2.9M9.6 14.3l-3.4 2.6" stroke-linecap="round"/></svg>',
};
const SVG_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const SVG_CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

const MODES = [
  { key: "clinical", label: "Clinical", title: "Clinical staging",
    sections: [{ key: "c", title: "Clinical (cTNM)", prefix: "c", typeId: 1 }] },
  { key: "pathological", label: "Pathological", title: "Pathological staging",
    sections: [{ key: "p", title: "Pathological (pTNM)", prefix: "p", typeId: 2 }] },
  { key: "posttherapy", label: "Post-therapy", title: "Post-therapy staging",
    sections: [
      { key: "c", title: "Pre-treatment (cTNM)", prefix: "c", typeId: 1 },
      { key: "yp", title: "Post-therapy (ypTNM)", prefix: "yp", typeId: 2 },
    ] },
  { key: "denovo", label: "De Novo", title: "De novo metastatic",
    sections: [{ key: "c", title: "Clinical (cTNM)", prefix: "c", typeId: 1 }] },
];

const FIELD_NAMES = { T: "Primary tumor", N: "Regional nodes", M: "Distant metastasis" };
const CORE = ["T", "N", "M"];
const RESPONSE_TYPE_LABELS = ["No Response", "Partial Response", "Complete Response"];
const M1_VALUES = ["M1", "cM1", "pM1", "M1a", "M1b", "M1c", "cM1a", "cM1b", "cM1c"];

const bio = { AJCCfactorG: "G2", AJCCfactorER: "Positive", AJCCfactorPR: "Positive", AJCCfactorHER2: "Negative" };
/** Test cases per staging type: [label, { sectionKey: values }] */
const TEST_CASES = {
  clinical: [
    ["cT2 cN1 cM0 → IIB", { c: { T: "T2", N: "N1", M: "M0", ...bio } }],
    ["cT1c cN0 cM0 → IA", { c: { T: "T1c", N: "N0", M: "M0", ...bio } }],
    ["cT3 cN3 cM0 → IIIC", { c: { T: "T3", N: "N3", M: "M0", ...bio } }],
  ],
  pathological: [
    ["pT1c pN0 → IA", { p: { T: "T1c", N: "N0", M: "M0", ...bio } }],
    ["pT2 pN2 → IIIA", { p: { T: "T2", N: "N2", M: "M0", ...bio } }],
    ["pTis pN0 → 0", { p: { T: "Tis", N: "N0", M: "M0", ...bio } }],
  ],
  posttherapy: [
    ["Complete: cT2 cN1 → ypT0 ypN0", { c: { T: "T2", N: "N1", M: "M0", ...bio }, yp: { T: "T0", N: "N0", M: "M0", ...bio } }],
    ["Partial: cT3 cN2 → ypT1c ypN1", { c: { T: "T3", N: "N2", M: "M0", ...bio }, yp: { T: "T1c", N: "N1", M: "M0", ...bio } }],
    ["No response: cT1c cN2 → ypT2 ypN2", { c: { T: "T1c", N: "N2", M: "M0", ...bio }, yp: { T: "T2", N: "N2", M: "M0", ...bio } }],
  ],
  denovo: [
    ["cT2 cN1 cM1 → IV", { c: { T: "T2", N: "N1", M: "M1", ...bio } }],
    ["cT4d cN3 cM1 → IV", { c: { T: "T4d", N: "N3", M: "M1", ...bio } }],
  ],
};

/* ════════════════════════════════════════════════════════════════════════
 * STATE — values are kept per staging type, so switching tabs keeps entries
 * ════════════════════════════════════════════════════════════════════════ */
const emptyResult = () => ({ stage: "...", tnm: "..." });
const emptyMode = (m) => ({
  values: Object.fromEntries(m.sections.map((s) => [s.key, {}])),
  results: Object.fromEntries(m.sections.map((s) => [s.key, emptyResult()])),
  response: { type: "", id: null, loading: false, stage: "...", tnm: "..." },
  run: 0, test: null,
});

const state = {
  diseaseSites: [], disease: "", items: { 1: [], 2: [] },
  modeIdx: 0, field: null,      // field = { sec, col } while a definitions screen is open
  pushed: false,                // phone: a history entry exists for the open field (so system Back closes it)
  collapsed: new Set(),         // "<mode>-<section>" keys whose prognostic factors are collapsed (open by default)
  modes: Object.fromEntries(MODES.map((m) => [m.key, emptyMode(m)])),
};
const mode = () => MODES[state.modeIdx];
const ms = (key = mode().key) => state.modes[key];

/* ════════════════════════════════════════════════════════════════════════
 * HELPERS
 * ════════════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clean = (s) => (s ?? "").toString().replace(/[\n\r]/g, "").trim();
const isM1 = (m) => M1_VALUES.some((v) => clean(m).toUpperCase() === v.toUpperCase());
const sectionOf = (m, key) => m.sections.find((s) => s.key === key);
const isPhone = () => !!window.matchMedia && window.matchMedia("(max-width: 680px)").matches;

/** Displayed value with its classification prefix (yp keeps clinical M). */
function shown(sec, col, v) {
  if (!v) return "";
  if (!CORE.includes(col) || /^(c|p|yp)[TNM]/.test(v)) return v;
  return (sec.prefix === "yp" && col === "M" ? "c" : sec.prefix) + v;
}
const codeLabel = (sec, col) => (CORE.includes(col) ? (sec.prefix === "yp" && col === "M" ? "cM" : sec.prefix + col) : col);
const columnTitle = (sec, col) => (state.items[sec.typeId].find((i) => i.columnName === col) || {}).columnTitle || col;

const sectionComplete = (modeKey, secKey) => CORE.every((k) => ms(modeKey).values[secKey][k]);
const modeComplete = (m) => m.sections.every((s) => sectionComplete(m.key, s.key));

/** Options for a field, restricted by the flow's M rules. */
function optionsFor(m, sec, col) {
  const list = (state.items[sec.typeId] || []).find((i) => i.columnName === col)?.valueDescList || [];
  if (col !== "M") return list;
  if (m.key === "denovo") return list.filter((v) => isM1(v.validValue));
  if (m.key === "posttherapy") return list.filter((v) => !isM1(v.validValue));
  return list;
}

/* ════════════════════════════════════════════════════════════════════════
 * ACTIONS
 * ════════════════════════════════════════════════════════════════════════ */
async function calcSection(m, sec) {
  const st = ms(m.key), vals = st.values[sec.key];
  if (!Object.keys(vals).length) { st.results[sec.key] = emptyResult(); return render(); }
  try {
    const d = await api.calculate(state.disease, sec.typeId, vals, sec.prefix);
    st.results[sec.key] = { stage: d?.stage || "...", tnm: d?.tnmClassification || "..." };
  } catch { st.results[sec.key] = { stage: "Error", tnm: "Error" }; }
  render();
}

async function runResponse() {
  const m = MODES.find((x) => x.key === "posttherapy"), st = ms("posttherapy");
  const run = ++st.run;
  if (!modeComplete(m)) { st.response = { type: "", id: null, loading: false, stage: "...", tnm: "..." }; return render(); }
  st.response = { type: "", id: null, loading: true, stage: "...", tnm: "..." };
  render();
  const c = st.values.c, p = st.values.yp;
  try {
    const data = await api.breastResponse(c, p);
    if (run !== st.run) return;
    const idx = typeof data === "number" ? data : parseInt(String(data ?? ""), 10);
    if (isNaN(idx) || !RESPONSE_TYPE_LABELS[idx]) throw new Error("bad response");
    Object.assign(st.response, { id: idx, type: RESPONSE_TYPE_LABELS[idx], loading: false });
    render();
    const fin = await api.calculateBreast(p, idx);
    if (run !== st.run) return;
    Object.assign(st.response, { stage: fin?.stage || "...", tnm: fin?.tnmClassification || "..." });
  } catch {
    if (run !== st.run) return;
    Object.assign(st.response, { type: st.response.type || "Error", loading: false, stage: "Error", tnm: "Error" });
  }
  render();
}

function setValue(secKey, col, value) {
  const m = mode(), sec = sectionOf(m, secKey), st = ms(), vals = st.values[secKey];
  if (value) vals[col] = clean(value); else delete vals[col];
  st.test = null;   // values no longer match a loaded test case
  render();
  calcSection(m, sec);
  if (m.key === "posttherapy") runResponse();
}

function nextEmptyField() {
  const m = mode();
  for (const s of m.sections) for (const k of CORE) if (!ms().values[s.key][k]) return { sec: s.key, col: k };
  return null;
}

/* Navigation between the summary and a definitions screen.
 * On phones each definitions screen gets a history entry, so the system Back
 * gesture / button returns to the summary like a native app. */
let savedScroll = 0, navDir = "";
function openField(sec, col) {
  if (isPhone()) {
    if (!state.field) savedScroll = window.scrollY;
    if (!state.pushed) { history.pushState({ field: true }, ""); state.pushed = true; }
  }
  state.field = { sec, col };
  navDir = "right";
  render();
  if (isPhone()) window.scrollTo(0, 0);
}
function closeField() {
  if (state.pushed) { history.back(); return; }   // popstate finishes the job
  finishClose();
}
function finishClose() {
  state.field = null; state.pushed = false; navDir = "left";
  render();
  if (isPhone()) window.scrollTo(0, savedScroll);
}
window.addEventListener("popstate", () => { if (state.field) { state.pushed = false; finishClose(); } });

function choose(value) {
  const { sec, col } = state.field;
  setValue(sec, col, value);
  if (isPhone()) { closeField(); return; }                 // phone: back to the summary, like a native picker
  const next = value && CORE.includes(col) ? nextEmptyField() : null;
  if (next) openField(next.sec, next.col);                 // desktop: move on to the next empty category
}

function loadTest(i) {
  const m = mode(), [, data] = TEST_CASES[m.key][i];
  state.modes[m.key] = emptyMode(m);
  for (const s of m.sections) state.modes[m.key].values[s.key] = { ...(data[s.key] || {}) };
  ms().test = i;
  render();
  m.sections.forEach((s) => calcSection(m, s));
  if (m.key === "posttherapy") runResponse();
}

function clearMode() {
  const m = mode();
  state.modes[m.key] = emptyMode(m);
  if (state.field) closeField(); else render();
}

function switchMode(i) {
  if (i === state.modeIdx && !state.field) return;
  state.modeIdx = i;
  if (state.field) { if (state.pushed) { state.pushed = false; history.back(); } state.field = null; }
  navDir = "";
  render();
  if (isPhone()) window.scrollTo(0, 0);
}

async function selectDisease(id) {
  state.disease = id;
  state.items = { 1: [], 2: [] };
  MODES.forEach((m) => (state.modes[m.key] = emptyMode(m)));
  if (state.field) closeField();
  render();
  if (!id) return;
  const [c, p] = await Promise.all([api.stagingItems(id, 1).catch(() => []), api.stagingItems(id, 2).catch(() => [])]);
  state.items = { 1: c, 2: p };
  render();
}

/* ════════════════════════════════════════════════════════════════════════
 * RENDER
 * ════════════════════════════════════════════════════════════════════════ */
function renderBars() {
  const m = mode(), f = state.field;
  $("app").classList.toggle("field-open", !!f);
  if (f && isPhone()) {
    const sec = sectionOf(m, f.sec);
    $("apptitle").textContent = CORE.includes(f.col) ? `${codeLabel(sec, f.col)} · ${FIELD_NAMES[f.col]}` : columnTitle(sec, f.col);
    $("appsub").textContent = sec.title;
  } else if (isPhone()) {
    $("apptitle").textContent = m.title;
    $("appsub").textContent = "AJCC Staging";
  } else {
    $("apptitle").textContent = "AJCC Staging Calculator";
    $("appsub").textContent = m.title;
  }
  $("mockbadge").hidden = !USE_MOCK;

  const sel = $("disease");
  const opts = `<option value="">-- Select --</option>` + state.diseaseSites.map((d) =>
    `<option value="${esc(d.ajccDiseaseId)}" ${d.ajccDiseaseId === state.disease ? "selected" : ""}>${esc(d.diseaseTitle)}</option>`).join("");
  if (sel.dataset.sig !== opts) { sel.innerHTML = opts; sel.dataset.sig = opts; }

  const tests = USE_MOCK && state.disease ? `<div class="tests"><span>Test cases</span>
    ${TEST_CASES[m.key].map((t, i) => `<button class="btn ${ms().test === i ? "sel" : ""}" data-action="test" data-i="${i}" aria-pressed="${ms().test === i}">${esc(t[0])}</button>`).join("")}
    <button class="btn ghost" data-action="clear">Clear</button></div>` : "";
  if ($("tests").dataset.sig !== tests) { $("tests").innerHTML = tests; $("tests").dataset.sig = tests; }   // keeps horizontal scroll position
}

function rowButton(sec, col, title, small) {
  const v = ms().values[sec.key][col];
  const on = !!(state.field && state.field.sec === sec.key && state.field.col === col);
  const label = small ? title : codeLabel(sec, col);
  return `<button class="rowbtn ${small ? "small" : ""} ${v ? "filled" : ""} ${on ? "on" : ""}" data-action="pick" data-sec="${sec.key}" data-col="${col}" aria-current="${on}">
    <span class="code">${esc(label)}</span><span class="name">${small ? "" : FIELD_NAMES[col]}</span>
    <span class="val ${v ? "" : "empty"}">${v ? `<span class="tick">${SVG_CHECK}</span>${esc(small ? v : shown(sec, col, v))}` : "Select"}</span>${SVG_CHEV}</button>`;
}

function renderSection(m, sec) {
  const items = state.items[sec.typeId] || [];
  const factors = items.filter((i) => !CORE.includes(i.columnName));
  const key = `${m.key}-${sec.key}`, closed = state.collapsed.has(key);
  const n = factors.filter((f) => ms().values[sec.key][f.columnName]).length;
  return `<div class="sec">
    <div class="sec-title">${esc(sec.title)}</div>
    <div class="list">${CORE.map((k) => rowButton(sec, k)).join("")}</div>
    ${factors.length ? `<div class="factors ${closed ? "collapsed" : ""}">
      <button class="factors-title" data-action="toggle-factors" data-key="${key}" aria-expanded="${!closed}"><span class="caret">&#9660;</span>Prognostic factors<span class="count">${n}/${factors.length}</span></button>
      <div class="list">${factors.map((f) => rowButton(sec, f.columnName, f.columnTitle, true)).join("")}</div></div>` : ""}
  </div>`;
}

const versionLine = () => `<div class="ver">${esc(RULES_LABEL)} · App v${APP_VERSION}${USE_MOCK ? " · test data, not for clinical use" : ""}</div>`;

function renderResult(m) {
  const st = ms();
  const missing = m.sections.flatMap((s) => CORE.filter((k) => !st.values[s.key][k]).map((k) => codeLabel(s, k)));
  if (missing.length) {
    const what = m.key === "denovo" ? "De novo stage" : m.key === "posttherapy" ? "Response and post-therapy stage" : "Stage group";
    return `<div class="result"><div class="pending"><strong>${what}</strong>Select ${missing.join(", ")} to calculate.</div></div>`;
  }
  if (m.key === "denovo") {
    return `<div class="result">
      <div class="tnmbox"><div class="cap">cTNM</div><div class="v">${esc(st.results.c.tnm)}</div></div>
      <div class="stagebox"><div class="cap">De novo metastatic · Prognostic stage</div><div class="v">Stage IV</div>
        <p>Distant metastasis at diagnosis. Pathological and response staging do not apply.</p></div>${versionLine()}</div>`;
  }
  if (m.key === "posttherapy") {
    const r = st.response, c = st.values.c, p = st.values.yp;
    const secC = sectionOf(m, "c"), secY = sectionOf(m, "yp");
    return `<div class="result">
      <table class="cmp"><thead><tr><th></th><th>Clinical</th><th>Post-therapy</th></tr></thead><tbody>
        ${CORE.map((k) => `<tr><td>${k}</td><td>${esc(shown(secC, k, c[k]))}</td><td>${esc(shown(secY, k, p[k]))}</td></tr>`).join("")}
      </tbody></table>
      <div class="duo">
        <div class="respbox"><div class="cap">Response</div><div class="v ${r.type === "Error" ? "err" : ""}">${r.loading ? "Calculating…" : esc(r.type || "—")}</div></div>
        <div class="tnmbox"><div class="cap">Post-therapy stage</div><div class="v">${esc(r.stage)}</div>${r.tnm !== "..." ? `<div class="m">${esc(r.tnm)}</div>` : ""}</div>
      </div>${versionLine()}</div>`;
  }
  const sec = m.sections[0], res = st.results[sec.key];
  return `<div class="result">
    <div class="tnmbox"><div class="cap">${sec.prefix}TNM</div><div class="v">${esc(res.tnm)}</div></div>
    <div class="stagebox"><div class="cap">${m.key === "clinical" ? "Clinical" : "Pathological"} stage group</div><div class="v ${res.stage === "Error" ? "err" : ""}">${esc(res.stage)}</div></div>${versionLine()}</div>`;
}

function renderMain() {
  const m = mode(), main = $("main");
  main.className = "main" + (state.field ? " hidden" : "");
  if (!state.disease) { main.innerHTML = `<div class="pending"><strong>No disease site selected</strong>Choose a site above to begin.</div>`; return; }
  if (!state.items[1].length) { main.innerHTML = `<div class="pending">Loading categories…</div>`; return; }
  main.innerHTML = `<div class="screen ${navDir === "left" ? "from-left" : ""}" data-k="${m.key}${state.field && isPhone() ? "" : "-sum"}">${m.sections.map((s) => renderSection(m, s)).join("")}${renderResult(m)}</div>`;
}

function renderDetail() {
  const m = mode(), d = $("detail");
  d.className = "detail" + (state.field ? " open" : "");
  if (!state.field) {
    d.innerHTML = `<div class="screen" data-k="${m.key}-intro"><h2>${esc(m.title)}</h2><p class="muted">Select a category to see its definitions.</p></div>`;
    return;
  }
  const sec = sectionOf(m, state.field.sec), col = state.field.col;
  const cur = ms().values[sec.key][col];
  const isCore = CORE.includes(col);
  const title = isCore ? `<span class="code">${esc(codeLabel(sec, col))}</span> ${FIELD_NAMES[col]}` : esc(columnTitle(sec, col));
  let note = "";
  if (col === "M" && m.key === "denovo") note = "Only M1 is offered: de novo metastatic staging requires distant metastasis at diagnosis.";
  if (col === "M" && m.key === "posttherapy") note = sec.prefix === "yp" ? "Post-therapy staging carries the clinical M category." : "M1 is not offered: a patient with cM1 is staged as de novo metastatic.";
  d.innerHTML = `<div class="screen" data-k="${sec.key}-${col}">
    <button class="dback" data-action="back">&larr; Back</button>
    <h2>${title}</h2>
    <div class="choices">${optionsFor(m, sec, col).map((v) => {
      const val = clean(v.validValue), sel = val === cur;
      return `<button class="choice ${sel ? "sel" : ""}" data-action="choose" data-v="${esc(val)}" aria-pressed="${sel}"><b>${esc(isCore ? shown(sec, col, val) : val)}</b><span class="d">${esc(v.descr)}</span><span class="ck">${sel ? SVG_CHECK : ""}</span></button>`;
    }).join("")}</div>
    ${cur ? `<button class="clear" data-action="choose" data-v="">Clear selection</button>` : ""}
    ${note ? `<p class="note">${esc(note)}</p>` : ""}
  </div>`;
}

function renderTabs() {
  $("tabs").innerHTML = MODES.map((m, i) => `<button class="tab ${i === state.modeIdx ? "active" : ""}" data-action="tab" data-i="${i}" aria-current="${i === state.modeIdx}" aria-label="${esc(m.title)}">
    ${ICONS[m.key]}<span>${esc(m.label)}</span>${modeComplete(m) ? `<span class="dot" title="Complete"></span>` : ""}</button>`).join("");
}

// Only re-run the slide animation when the screen actually changes
let lastKeys = {};
function render() {
  renderBars(); renderMain(); renderDetail(); renderTabs();
  for (const id of ["main", "detail"]) {
    const el = $(id).querySelector(".screen");
    if (!el) continue;
    if (lastKeys[id] === el.dataset.k && !navDir) el.style.animation = "none";
    lastKeys[id] = el.dataset.k;
  }
  navDir = "";
}

/* ════════════════════════════════════════════════════════════════════════
 * EVENTS (delegated)
 * ════════════════════════════════════════════════════════════════════════ */
document.addEventListener("change", (e) => {
  if (e.target.dataset.action === "disease") selectDisease(e.target.value);
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.tagName === "SELECT") return;
  const a = el.dataset.action;
  if (a === "pick") openField(el.dataset.sec, el.dataset.col);
  else if (a === "choose") choose(el.dataset.v);
  else if (a === "back") closeField();
  else if (a === "tab") switchMode(+el.dataset.i);
  else if (a === "test") loadTest(+el.dataset.i);
  else if (a === "clear") clearMode();
  else if (a === "toggle-factors") {
    const k = el.dataset.key;
    state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k);
    render();
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.field) closeField(); });
window.addEventListener("resize", () => renderBars());

/* ════════════════════════════════════════════════════════════════════════
 * Plain web app: no offline caching. If a device still has the service worker
 * from the earlier installable (PWA) build, remove it and its cache so that
 * device always loads the live page.
 * ════════════════════════════════════════════════════════════════════════ */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister())).catch(() => {});
}
if (window.caches) {
  caches.keys().then((keys) => keys.filter((k) => k.startsWith("ajcc-staging")).forEach((k) => caches.delete(k))).catch(() => {});
}

/* Init: load sites; auto-select when there is only one */
render();
api.diseases().then((data) => {
  const d = data.find((x) => x.ajccDiseaseId === "BRE-DCIS");
  state.diseaseSites = d ? [d] : [];
  if (state.diseaseSites.length === 1) selectDisease(state.diseaseSites[0].ajccDiseaseId); else render();
}).catch((err) => console.error("Error fetching diseases:", err));
</script>
</body>
</html>
